[package]
name = "majlis-media"
version = "0.7.0"
edition = "2021"
description = "Majlis media engine: Stremio-compatible addon client, stream ranking, torrent streaming over local HTTP"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "sync", "time"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "9.1"
anyhow = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
getrandom = "0.3"
