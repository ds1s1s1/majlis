[package]
name = "majlis-setup"
version = "0.1.0-beta"
description = "Majlis Windows Installer"
authors = ["Majlis Contributors"]
edition = "2021"

[lib]
name = "majlis_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
opt-level = 3
codegen-units = 1
